<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Senhor Burger</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0e0e12;color:#e4e1e7;font-family:Arial,sans-serif}
    #loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffc665;margin-right:8px;animation:pulse 1s infinite alternate}
    @keyframes pulse{to{opacity:.25}}
  </style>
</head>
<body>
  <div id="loading"><div><span class="dot"></span>Carregando experiência Senhor Burger...</div></div>
  <script>
    (async () => {
      try {
        const files = ['latest/chunk01.b64','latest/chunk02.b64','latest/chunk03.b64','latest/chunk04.b64'];
        const responses = await Promise.all(files.map(file => fetch(file, {cache:'no-store'})));
        responses.forEach((response, i) => {
          if (!response.ok) throw new Error(`Falha ao carregar ${files[i]}: ${response.status}`);
        });
        const parts = await Promise.all(responses.map(response => response.text()));
        const b64 = parts.join('').replace(/\s+/g,'');
        const binary = atob(b64);
        const compressed = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) compressed[i] = binary.charCodeAt(i);
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById('loading').innerHTML = '<div>Não foi possível carregar o site. Atualize a página.</div>';
      }
    })();
  </script>
</body>
</html>
